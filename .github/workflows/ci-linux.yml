name: Linux CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install libcurl4-openssl-dev libhidapi-dev libzip-dev
        pip install build
    - name: Build libconcord
      run: |
        cd libconcord
        mkdir m4; autoreconf --install
        ./configure
        make
        sudo make install
        sudo ldconfig
        cd -
    - name: Build libconcord Python bindings
      run: |
        cd libconcord/bindings/python
        python3 -m build
        pip install dist/*.whl
        python3 -c 'import libconcord; print(libconcord)'
        cd -
        
    - name: Build and Package libconcord
      run: |
        sudo apt-get install -y checkinstall
        cd libconcord
        mkdir -p m4; autoreconf --install
        ./configure
        make
        sudo checkinstall --default --pkgname=libconcord make install
        sudo ldconfig
        mv *.deb ../
        cd -

    - name: Build and Package concordance
      run: |
        cd concordance
        mkdir -p m4; autoreconf --install
        ./configure
        make
        sudo checkinstall --default --pkgname=concordance make install
        mv *.deb ../
        cd -

    - name: Upload Debian Packages
      uses: actions/upload-artifact@v4
      with:
        name: concordance-deb-packages
        path: ./*.deb

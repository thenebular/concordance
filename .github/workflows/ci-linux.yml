name: Linux CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install libcurl4-openssl-dev libhidapi-dev libzip-dev
        pip install build
    - name: Build libconcord
      run: |
        cd libconcord
        mkdir m4; autoreconf --install
        ./configure
        make
        sudo make install
        sudo ldconfig
        cd -
    - name: Build libconcord Python bindings
      run: |
        cd libconcord/bindings/python
        python3 -m build
        pip install dist/*.whl
        python3 -c 'import libconcord; print(libconcord)'
        cd -
        
    - name: Build libconcord and Package concordance
      run: |
        sudo apt-get install -y checkinstall

        # 1. Build and install libconcord natively onto the runner system
        cd libconcord
        mkdir -p m4; autoreconf --install
        ./configure
        make
        sudo make install
        sudo ldconfig
        cd -

        # 2. Build concordance and let checkinstall package it
        cd concordance
        mkdir -p m4; autoreconf --install
        ./configure
        make
        
        # 3. Create the .deb package. 
        # We pass libconcord.so.6 manually into checkinstall's tracking system
        # by copying it into the local folder where 'make install' executes.
        sudo cp -d /usr/local/lib/libconcord.so* .
        
        # We use an altered install command string to make sure checkinstall bundles the .so files too
        sudo checkinstall --default --pkgname=concordance \
          --run="make install && cp -d libconcord.so* /usr/local/lib/"
        
        mv *.deb ../
        cd -

    - name: Upload Debian Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: concordance-deb-package
        path: ./*.deb
